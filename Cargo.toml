[package]
name = "lagent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4"
colored = "3.1.1"
futures = "0.3.34"
rig = { version = "0.42.0", features = ["rmcp"] }
rmcp = { version = "2.2.0", features = ["client", "macros", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-std", "macros", "rt-multi-thread", "process"] }
